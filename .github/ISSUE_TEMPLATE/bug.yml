name: Bug report
description: Report a reproducible problem in Orako Core
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the Security tab.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Release, commit SHA, or container tag
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data.
      render: shell
