#
# buf configuration for the Orako API contract. The proto files under proto/
# are the transport-agnostic source of truth for the RPC surface and the typed
# event stream.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
