#
# sqlc configuration. Migrations under migrations/ are the schema; queries/
# holds the hand-written named queries. Generated Go lands in the eventlog
# adapter package as *.gen.go and is never hand-edited.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: eventlog
        out: ../internal/adapters/eventlog
        sql_package: pgx/v5
        emit_json_tags: true
        emit_exported_queries: false
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
        output_models_file_name: sqlc_models.gen.go
        output_db_file_name: sqlc_db.gen.go
        output_querier_file_name: sqlc_querier.gen.go
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
